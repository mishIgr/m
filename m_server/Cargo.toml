[package]
name = "m_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m_server"
path = "src/main.rs"

[dependencies]
m_core = { path = "../m_core" }

serde = { version = "1.0", features = ["derive"] }
subtle = { version = "2.5"}
toml = "0.9.8"
hex = "0.4"

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.11"
prost = "0.12"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
lru = "0.12"
