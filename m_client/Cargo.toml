[package]
name = "m_client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m_client"
path = "src/main.rs"

[dependencies]
m_core = { path = "../m_core" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.11"
prost = "0.12"
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
hex = "0.4"
