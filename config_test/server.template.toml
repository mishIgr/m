[host]
bind_address = "0.0.0.0:50051"

[database]
path = "{{DB_PATH}}"

[logging]
path = "{{LOGS_DIR}}"
max_files = 5
max_file_size_mb = 10
basename = "m_server"

[delivery]
ack_timeout_secs = 10
max_retries = 10
retry_interval_secs = 1

[performance]
channel_buffer_size = 128
dedup_cache_size = 10000

[encryption]
user_key = "{{USER_KEY}}"
admin_key = "{{ADMIN_KEY}}"
