[host]
bind_address = "0.0.0.0:50051"

[database]
path = "~/.local/share/m/server.redb"

[logging]
log_dir = "~/.local/share/m/server-logs/"
max_files = 5
max_file_size = 10485760

[delivery]
ack_timeout_secs = 10
max_retries = 10
retry_interval_secs = 1

[performance]
channel_buffer_size = 128
dedup_cache_size = 10000

[encryption]
user_key = "1a2b3c4d5e6f1234567890abcdef12341a2b3c4d5e6f1234567890abcdef1234"
admin_key = "1a2b3c4d5e6f1234567890abcdef12351a2b3c4d5e6f1234567890abcdef1235"
